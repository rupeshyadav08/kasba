# Deployed by .github/workflows/watcher.yml, which fills in the KV namespace id.
name = "kasba-watcher"
main = "index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[triggers]
# Every 30 minutes, 5:30 am to 11:30 pm India time (cron runs in UTC).
crons = ["*/30 0-17 * * *"]

[[kv_namespaces]]
binding = "WATCH"
id = "KV_ID"
