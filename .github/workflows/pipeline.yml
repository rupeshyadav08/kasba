name: News pipeline

on:
  schedule:
    # GitHub delays or drops scheduled runs at busy minutes like :00 and :30 (on 23-24 Oct only one
    # run in 4-5 hours started), so this asks at a quieter minute. Hourly keeps the private repo
    # inside GitHub's 2,000 free Actions minutes a month.
    - cron: '17 0-16 * * *' # every hour, 6:00 to 22:00 India time
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Draft only: print drafts in the log, send nothing, change nothing'
        type: boolean
        default: false
      probe_urls:
        description: 'Debug: space-separated URLs to inspect before the run'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: news-pipeline
  cancel-in-progress: false

jobs:
  run:
    # Sources marked "india" in sources.json (RBI) refuse GitHub's servers; pipeline-india.yml
    # reads those on the self-hosted runner in India.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # pdftotext reads PDFs; tesseract reads scanned ones (CBSE and UP notices are often scans).
      - name: Install PDF and OCR tools
        run: |
          command -v pdftotext && command -v tesseract && exit 0
          if command -v brew; then brew install poppler tesseract tesseract-lang
          else sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-hin >/dev/null; fi

      - name: Probe pages (debug only)
        if: ${{ inputs.probe_urls != '' && inputs.probe_urls != null }}
        env:
          PROBE_URLS: ${{ inputs.probe_urls }}
        run: node pipeline/probe.mjs $PROBE_URLS

      - name: Fetch, draft and publish
        id: pipeline
        run: node pipeline/run.mjs
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # Stories trigger a Cloudflare build; state-only commits carry [skip ci] so they don't.
      - name: Commit
        if: ${{ always() && inputs.dry_run != true }}
        run: |
          git config user.name "kasba-pipeline"
          git config user.email "admin@kasba.co.in"
          git add pipeline/state.json pipeline/drafts src/content/stories
          git diff --cached --quiet && exit 0
          if [ "${{ steps.pipeline.outputs.published }}" != "" ] && [ "${{ steps.pipeline.outputs.published }}" != "0" ]; then
            git commit -m "Publish ${{ steps.pipeline.outputs.published }} approved stories"
          else
            git commit -m "[skip ci] Pipeline state"
          fi
          git pull --rebase origin main && git push origin HEAD:main

      # Cloudflare needs a couple of minutes to put new stories live before search engines are told.
      - name: Tell search engines (IndexNow)
        if: ${{ steps.pipeline.outputs.published != '' && steps.pipeline.outputs.published != '0' && inputs.dry_run != true }}
        continue-on-error: true
        env:
          IDS: ${{ steps.pipeline.outputs.ids }}
        run: sleep 180 && node pipeline/indexnow.mjs $IDS
