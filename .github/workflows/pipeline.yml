name: News pipeline

# Started by the result watcher's cron (workers/watcher/index.js, startPipelines), which runs on
# time; GitHub's own schedule ran hours late or not at all on 2-3 Nov 2026.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Draft only: print drafts in the log, send nothing, change nothing'
        type: boolean
        default: false
      urgent:
        description: 'Put new stories live at once (set by the result watcher)'
        type: boolean
        default: false
      probe_urls:
        description: 'Debug: space-separated URLs to inspect before the run'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: news-pipeline
  cancel-in-progress: false

jobs:
  run:
    # Sources marked "india" in sources.json (RBI) refuse GitHub's servers; pipeline-india.yml
    # reads those on the self-hosted runner in India.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # A run that waited in the queue behind another must start from the branch as it is now, not
      # from the commit it was triggered on, or it re-publishes the same drafts and its push fails.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      # pdftotext reads PDFs; tesseract reads scanned ones (CBSE and UP notices are often scans).
      - name: Install PDF and OCR tools
        run: |
          command -v pdftotext && command -v tesseract && exit 0
          if command -v brew; then brew install poppler tesseract tesseract-lang
          else sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-hin >/dev/null; fi

      # Story pictures are resized with sharp, which comes with the site's locked packages.
      - name: Install packages
        continue-on-error: true
        run: npm ci --no-audit --no-fund

      - name: Probe pages (debug only)
        if: ${{ inputs.probe_urls != '' && inputs.probe_urls != null }}
        env:
          PROBE_URLS: ${{ inputs.probe_urls }}
        run: node pipeline/probe.mjs $PROBE_URLS

      - name: Fetch, draft and publish
        id: pipeline
        run: node pipeline/run.mjs
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          URGENT: ${{ inputs.urgent || 'false' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # Only a deploy commit makes Cloudflare build the site. Stories are batched (run.mjs decides
      # when, at most every couple of hours) so 20+ a day stay inside the free 500 builds a month.
      - name: Commit
        if: ${{ always() && inputs.dry_run != true }}
        run: |
          git config user.name "kasba-pipeline"
          git config user.email "admin@kasba.co.in"
          git add -A pipeline/state.json pipeline/drafts pipeline/inbox src/content/stories public/img/s
          git diff --cached --quiet && exit 0
          if [ "${{ steps.pipeline.outputs.deploy }}" = "true" ]; then
            git commit -m "Put ${{ steps.pipeline.outputs.live }} stories live"
          elif [ "${{ steps.pipeline.outputs.published }}" != "" ] && [ "${{ steps.pipeline.outputs.published }}" != "0" ]; then
            git commit -m "[skip ci] Queue ${{ steps.pipeline.outputs.published }} stories for the next deploy"
          else
            git commit -m "[skip ci] Pipeline state"
          fi
          git pull --rebase origin main && git push origin HEAD:main

      # Cloudflare needs a couple of minutes to put new stories live before search engines are told.
      - name: Tell search engines (IndexNow)
        if: ${{ steps.pipeline.outputs.ids != '' && inputs.dry_run != true }}
        continue-on-error: true
        env:
          IDS: ${{ steps.pipeline.outputs.ids }}
        run: sleep 180 && node pipeline/indexnow.mjs $IDS
