name: AI cinema test

# Test videos for a separate, wordless worldwide channel (not Kasba news). Each shot list in
# cinema/<name>.json becomes 5-second vertical shots on Modal (gpu/cinema.py, free monthly credit),
# joined with short cross-fades and sent to the editor on Telegram. Nothing is posted anywhere;
# music is added in the YouTube or Instagram app when posting.
on:
  workflow_dispatch:
    inputs:
      video:
        description: 'Shot list in cinema/ (without .json)'
        type: string
        default: giant-tortoise
      seed:
        description: 'Seed (change it for a different take)'
        type: string
        default: '7'

permissions:
  contents: read

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install -q "modal>=1.6,<2"
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null)
      - name: Make the shots on Modal
        run: modal run gpu/cinema.py --shots cinema/${{ inputs.video }}.json --out clips/ --seed ${{ inputs.seed }}
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      - name: Join the shots
        run: |
          set -e
          files=(clips/*.mp4); n=${#files[@]}
          inputs=""; for f in "${files[@]}"; do inputs="$inputs -i $f"; done
          # Each shot is 5 s; 0.5 s cross-fades between them.
          graph=""; prev="[0:v]"; off=0
          for ((i=1; i<n; i++)); do
            d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "${files[$((i-1))]}")
            off=$(python3 -c "print(round($off + $d - 0.5, 3))")
            graph="$graph${prev}[$i:v]xfade=transition=fade:duration=0.5:offset=$off[v$i];"; prev="[v$i]"
          done
          ffmpeg -y -loglevel error $inputs -filter_complex "${graph%;}" -map "$prev" -c:v libx264 -crf 18 -pix_fmt yuv420p -movflags +faststart video.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 video.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: cinema-${{ inputs.video }}
          path: |
            video.mp4
            clips/
          retention-days: 14
      - name: Send to the editor
        run: |
          curl -sS -o /dev/null -w 'telegram %{http_code}\n' "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendVideo" \
            -F chat_id="$TELEGRAM_CHAT_ID" -F supports_streaming=true -F video=@video.mp4 \
            -F caption="🎬 AI cinema test: ${{ inputs.video }} (कहीं पोस्ट नहीं हुआ; music app में जोड़ें)"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
