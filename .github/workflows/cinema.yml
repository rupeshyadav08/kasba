name: AI cinema test

# Test videos for a separate, wordless worldwide channel (not Kasba news). Each shot list in
# cinema/<name>.json becomes 5-second vertical shots on Modal (gpu/cinema.py, free monthly credit),
# joined with short cross-fades and sent to the editor on Telegram. Nothing is posted anywhere;
# music is added in the YouTube or Instagram app when posting.
on:
  workflow_dispatch:
    inputs:
      video:
        description: 'Shot list in cinema/ (without .json)'
        type: string
        default: giant-tortoise
      seed:
        description: 'Seed (change it for a different take)'
        type: string
        default: '7'
      from_run:
        description: 'Reuse the finished video of this earlier run instead of rendering again (run id)'
        type: string
        default: ''
      trim:
        description: 'Seconds to cut from the start'
        type: string
        default: '0'
      voice:
        description: 'Add a Sarvam voiceover from cinema/<video>.voice.txt'
        type: boolean
        default: false
      sound:
        description: 'Add AI sound effects (MMAudio) and music (MusicGen) from cinema/<video>.sound.json'
        type: boolean
        default: false
      language:
        description: 'Voiceover language (en-IN, hi-IN, ...)'
        type: string
        default: en-IN
      audio:
        description: 'Only make narrator lines (Kokoro) and music cues (MusicGen) from cinema/<audio>.audio.json; commits them to this branch'
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  audio:
    if: inputs.audio != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Narrator lines (Kokoro, CPU)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg >/dev/null
          pip install -q "kokoro>=0.9" soundfile
          python scripts/cinema-narrate.py cinema/${{ inputs.audio }}.audio.json audio/
      - name: Music cues (MusicGen on Modal)
        run: |
          pip install -q "modal>=1.6,<2"
          modal run gpu/sound.py::music_main --plan cinema/${{ inputs.audio }}.audio.json --out audio/ --seed ${{ inputs.seed }}
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      - name: Save to this branch
        run: |
          mkdir -p cinema/out/${{ inputs.audio }}
          for f in $(find audio -name '*.wav'); do
            ffmpeg -y -loglevel error -i "$f" -c:a libmp3lame -q:a 2 "cinema/out/${{ inputs.audio }}/$(echo ${f#audio/} | tr / -).mp3"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add cinema/out && git commit -m "[skip ci] Audio for ${{ inputs.audio }}" && git push

  make:
    if: inputs.audio == ''
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install -q "modal>=1.6,<2"
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null)
      - name: Fetch the earlier video
        if: inputs.from_run != ''
        uses: actions/download-artifact@v4
        with:
          name: cinema-${{ inputs.video }}
          run-id: ${{ inputs.from_run }}
          github-token: ${{ github.token }}
      - name: Make the shots on Modal
        if: inputs.from_run == ''
        run: modal run gpu/cinema.py --shots cinema/${{ inputs.video }}.json --out clips/ --seed ${{ inputs.seed }}
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      - name: Join the shots
        if: inputs.from_run == ''
        run: |
          set -e
          files=(clips/*.mp4); n=${#files[@]}
          inputs=""; for f in "${files[@]}"; do inputs="$inputs -i $f"; done
          # Each shot is 5 s; 0.5 s cross-fades between them.
          graph=""; prev="[0:v]"; off=0
          for ((i=1; i<n; i++)); do
            d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "${files[$((i-1))]}")
            off=$(python3 -c "print(round($off + $d - 0.5, 3))")
            graph="$graph${prev}[$i:v]xfade=transition=fade:duration=0.5:offset=$off[v$i];"; prev="[v$i]"
          done
          ffmpeg -y -loglevel error $inputs -filter_complex "${graph%;}" -map "$prev" -c:v libx264 -crf 18 -pix_fmt yuv420p -movflags +faststart video.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 video.mp4
      - name: Make the sound on Modal
        if: inputs.sound
        run: |
          modal run gpu/sound.py --clips clips/ --plan cinema/${{ inputs.video }}.sound.json --out sound/
          python scripts/cinema-sound.py clips/ sound/ "${{ inputs.trim }}"
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      - name: Trim and voiceover
        if: (!inputs.sound) && (inputs.voice || inputs.trim != '0')
        run: |
          if [ "${{ inputs.voice }}" = "true" ]; then
            python scripts/cinema-voice.py cinema/${{ inputs.video }}.voice.txt "${{ inputs.trim }}" "${{ inputs.language }}"
          else
            ffmpeg -y -loglevel error -ss "${{ inputs.trim }}" -i video.mp4 -c:v libx264 -crf 18 -pix_fmt yuv420p -movflags +faststart cut.mp4 && mv cut.mp4 video.mp4
          fi
        env:
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: cinema-${{ inputs.video }}${{ inputs.from_run != '' && '-edit' || '' }}
          path: |
            video*.mp4
            clips/
            sound/
          retention-days: 14
      - name: Send to the editor
        run: |
          curl -sS -o /dev/null -w 'telegram %{http_code}\n' "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendVideo" \
            -F chat_id="$TELEGRAM_CHAT_ID" -F supports_streaming=true -F video=@video.mp4 \
            -F caption="🎬 AI cinema test: ${{ inputs.video }}${{ inputs.sound && ' (effects + music)' || '' }} (कहीं पोस्ट नहीं हुआ)"
          if [ -f video-sfx.mp4 ]; then
            curl -sS -o /dev/null -w 'telegram %{http_code}\n' "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendVideo" \
              -F chat_id="$TELEGRAM_CHAT_ID" -F supports_streaming=true -F video=@video-sfx.mp4 \
              -F caption="🎬 ${{ inputs.video }}: effects only, no music (कहीं पोस्ट नहीं हुआ)"
          fi
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
