name: Deploy result watcher

# Puts workers/watcher (the Cloudflare Worker that checks exam boards every 30 minutes) live.
# Runs when the watcher's code changes on main, or by hand.
# Secrets: CLOUDFLARE_API_TOKEN (Cloudflare template "Edit Cloudflare Workers"),
#          DISPATCH_TOKEN (fine-grained GitHub token for this repo with Actions: read and write).
on:
  push:
    branches: [main]
    paths: ['workers/watcher/**', '.github/workflows/watcher.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 964a8b32063b5c257c315bea393fcc3d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy
        working-directory: workers/watcher
        run: |
          npm i -g wrangler@4 >/dev/null
          # The KV store that remembers each board's notices: reuse it if it exists.
          id=$(wrangler kv namespace list | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const a=JSON.parse(s.slice(s.indexOf('[')));console.log((a.find(n=>n.title==='kasba-watch')||{}).id||'')})")
          if [ -z "$id" ]; then
            wrangler kv namespace create kasba-watch
            id=$(wrangler kv namespace list | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const a=JSON.parse(s.slice(s.indexOf('[')));console.log(a.find(n=>n.title==='kasba-watch').id)})")
          fi
          sed -i "s/KV_ID/$id/" wrangler.toml
          wrangler deploy
          printf '%s' "$DISPATCH_TOKEN" | wrangler secret put GITHUB_TOKEN
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
