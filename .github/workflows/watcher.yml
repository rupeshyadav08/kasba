name: Deploy result watcher

# Puts workers/watcher (the Cloudflare Worker that checks exam boards every 30 minutes) live.
# Runs when the watcher's code changes on main, or by hand.
# Secrets: CLOUDFLARE_API_TOKEN (Cloudflare template "Edit Cloudflare Workers"),
#          DISPATCH_TOKEN (fine-grained GitHub token for this repo with Actions: read and write).
on:
  push:
    branches: [main]
    paths: ['workers/watcher/**', '.github/workflows/watcher.yml']
  workflow_dispatch:
    inputs:
      test_token:
        description: 'Only test DISPATCH_TOKEN: start a dry run of the India pipeline (sends and changes nothing)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 964a8b32063b5c257c315bea393fcc3d
    steps:
      - name: Test DISPATCH_TOKEN
        if: ${{ inputs.test_token }}
        run: |
          code=$(curl -s -o body.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'User-Agent: kasba-watcher' \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/pipeline-india.yml/dispatches \
            -d '{"ref":"main","inputs":{"dry_run":true}}')
          echo "GitHub answered $code (204 means the token works)"; cat body.txt
          [ "$code" = 204 ]
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
      - uses: actions/checkout@v4
        if: ${{ !inputs.test_token }}
      - uses: actions/setup-node@v4
        if: ${{ !inputs.test_token }}
        with:
          node-version: 22
      - name: Deploy
        if: ${{ !inputs.test_token }}
        working-directory: workers/watcher
        run: |
          npm i -g wrangler@4 >/dev/null
          # The KV store that remembers each board's notices: reuse it if it exists.
          id=$(wrangler kv namespace list | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const a=JSON.parse(s.slice(s.indexOf('[')));console.log((a.find(n=>n.title==='kasba-watch')||{}).id||'')})")
          if [ -z "$id" ]; then
            wrangler kv namespace create kasba-watch
            id=$(wrangler kv namespace list | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const a=JSON.parse(s.slice(s.indexOf('[')));console.log(a.find(n=>n.title==='kasba-watch').id)})")
          fi
          sed -i "s/KV_ID/$id/" wrangler.toml
          wrangler deploy
          printf '%s' "$DISPATCH_TOKEN" | wrangler secret put GITHUB_TOKEN
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
