name: News pipeline (India runner)

# Sources that refuse GitHub's servers and Cloudflare (state exam boards) are marked "india": true
# in sources.json and read here, on Kasba's Oracle Cloud server in Mumbai (Always Free), registered
# as a self-hosted runner with the label kasba-india. Self-hosted runs use no GitHub minutes.
# Stories it publishes are queued for the main pipeline's next deploy; results, admit cards and
# answer keys go live at once.
on:
  schedule:
    - cron: '7,37 0-17 * * *' # every 30 minutes, about 5:30 am to 11:30 pm India time
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Draft only: print drafts in the log, send nothing, change nothing'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: news-pipeline-india
  cancel-in-progress: false

jobs:
  run:
    runs-on: [self-hosted, kasba-india]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Check PDF and OCR tools
        run: command -v pdftotext && command -v tesseract

      # sharp (story pictures) comes with the site's locked packages; npm's cache stays on the server.
      - name: Install packages
        continue-on-error: true
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Fetch, draft and publish
        id: pipeline
        run: node pipeline/run.mjs
        env:
          PIPELINE_MODE: india
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          # Intermediate certificates some board sites forget to send (BPSC, IBPS); kept on the server.
          NODE_EXTRA_CA_CERTS: /etc/kasba/extra-ca.pem
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit
        if: ${{ always() && inputs.dry_run != true }}
        run: |
          git config user.name "kasba-pipeline"
          git config user.email "admin@kasba.co.in"
          git add -A pipeline/state-india.json pipeline/drafts src/content/stories public/img/s
          git diff --cached --quiet && exit 0
          if [ "${{ steps.pipeline.outputs.deploy }}" = "true" ]; then
            git commit -m "Put ${{ steps.pipeline.outputs.live }} urgent stories live (India runner)"
          else
            git commit -m "[skip ci] Pipeline state (India runner)"
          fi
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done

      - name: Tell search engines (IndexNow)
        if: ${{ steps.pipeline.outputs.ids != '' && inputs.dry_run != true }}
        continue-on-error: true
        env:
          IDS: ${{ steps.pipeline.outputs.ids }}
        run: sleep 180 && node pipeline/indexnow.mjs $IDS
